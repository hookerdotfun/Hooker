    <meta property="og:type" content="website" />

    <!-- ⛔ twitter:card has no og equivalent: without summary_large_image X crops the card to a square.
         ⛔ X caches a card per image URL forever: a new image needs a NEW filename (og-v4.png). -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@hookerdotfun" />
    <meta name="twitter:title" content="Hooker" />
    <meta name="twitter:description" content="Launch a Pumpfun or Pons token with rules built into the token itself." />
    <meta name="twitter:image" content="https://hooker.fun/og-v4.png" />
    <!-- transparent, edge to edge (v4): a tab icon reads bigger with no tile around it -->
    <link rel="icon" href="/favicon-v4-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-v4-64.png" sizes="64x64" type="image/png" />
