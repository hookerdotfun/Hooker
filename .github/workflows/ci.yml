name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: unit tests and site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --test test/*.test.mjs
      - run: cd web && npm ci --no-audit --no-fund && npx vite build

  contracts:
    name: Robinhood Chain contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts@v5.7.0 --no-git
      - run: forge build --sizes
      # the fork tests against live Pons need an RPC and are skipped here (RHC_RPC_URL unset)
      - run: forge test
