name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: unit tests and site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --test test/*.test.mjs
      - run: cd web && npm ci --no-audit --no-fund && npx vite build

